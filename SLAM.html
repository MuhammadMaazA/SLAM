document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"UTF-8\">\n<title>Visual &amp; LiDAR SLAM — COMP0222 CW2 · Group 7<\u002Ftitle>\n<style>/* ==========================================================\n   SLAM Defence Deck — matte black, SF Pro, minimal accents\n   ========================================================== */\n\n:root {\n  --bg: #000000;\n  --bg-2: #0A0A0B;\n  --panel: #0E0E10;\n  --panel-2: #141416;\n  --line: rgba(255,255,255,0.08);\n  --line-2: rgba(255,255,255,0.14);\n  --ink: #F5F5F7;\n  --ink-2: rgba(245,245,247,0.72);\n  --ink-3: rgba(245,245,247,0.48);\n  --ink-4: rgba(245,245,247,0.28);\n\n  /* one accent only — restrained amber */\n  --accent: #E8B75E;\n  --accent-dim: rgba(232,183,94,0.55);\n\n  --good: #7CC28E;\n  --bad:  #E06C5B;\n\n  --radius: 14px;\n  --radius-lg: 18px;\n}\n\n* { box-sizing: border-box; }\n\nhtml, body {\n  margin: 0;\n  padding: 0;\n  background: var(--bg);\n  color: var(--ink);\n  font-family: -apple-system, BlinkMacSystemFont, \"SF Pro Display\", \"SF Pro Text\", \"Helvetica Neue\", Helvetica, Arial, sans-serif;\n  font-feature-settings: \"ss01\",\"cv11\",\"tnum\";\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n}\n\n/* SF Pro weight aliases */\n.w-100 { font-weight: 100; }\n.w-200 { font-weight: 200; }\n.w-300 { font-weight: 300; }\n.w-400 { font-weight: 400; }\n.w-500 { font-weight: 500; }\n.w-600 { font-weight: 600; }\n.w-700 { font-weight: 700; }\n.w-800 { font-weight: 800; }\n.w-900 { font-weight: 900; }\n\n.mono {\n  font-family: ui-monospace, \"SF Mono\", Menlo, Consolas, monospace;\n  font-feature-settings: \"tnum\";\n}\n\n/* ==========================================================\n   Slide canvas\n   ========================================================== */\n.slide {\n  position: relative;\n  width: 1920px;\n  height: 1080px;\n  background: var(--bg);\n  color: var(--ink);\n  overflow: hidden;\n  display: flex;\n  flex-direction: column;\n  padding: 96px 112px;\n}\n\n/* subtle grid accent — very faint */\n.slide::before {\n  content: \"\";\n  position: absolute;\n  inset: 0;\n  background-image:\n    linear-gradient(to right, rgba(255,255,255,0.018) 1px, transparent 1px),\n    linear-gradient(to bottom, rgba(255,255,255,0.018) 1px, transparent 1px);\n  background-size: 120px 120px;\n  pointer-events: none;\n}\n\n/* thin top/bottom hairlines */\n.slide::after {\n  content: \"\";\n  position: absolute;\n  left: 112px; right: 112px;\n  top: 60px;\n  height: 1px;\n  background: var(--line);\n}\n\n/* chrome */\n.chrome {\n  position: absolute;\n  top: 36px;\n  left: 112px;\n  right: 112px;\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  color: var(--ink-3);\n  font-size: 14px;\n  letter-spacing: 0.12em;\n  text-transform: uppercase;\n  font-weight: 500;\n}\n.chrome .num { color: var(--ink-4); }\n.chrome .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-right: 10px; vertical-align: middle; }\n\n.content { position: relative; z-index: 1; display: flex; flex-direction: column; flex: 1; min-height: 0; }\n\n/* ==========================================================\n   Typography\n   ========================================================== */\n.eyebrow {\n  font-size: 13px;\n  letter-spacing: 0.18em;\n  text-transform: uppercase;\n  color: var(--ink-3);\n  font-weight: 500;\n}\n\n.display {\n  font-size: 160px;\n  line-height: 0.92;\n  letter-spacing: -0.035em;\n  font-weight: 700;\n}\n.display-2 {\n  font-size: 112px;\n  line-height: 0.95;\n  letter-spacing: -0.03em;\n  font-weight: 600;\n}\n\n.title {\n  font-size: 72px;\n  line-height: 1.02;\n  letter-spacing: -0.02em;\n  font-weight: 600;\n}\n\n.subtitle {\n  font-size: 32px;\n  line-height: 1.25;\n  color: var(--ink-2);\n  font-weight: 300;\n  letter-spacing: -0.01em;\n}\n\n.caption { font-size: 18px; color: var(--ink-3); font-weight: 400; }\n\n.lead {\n  font-size: 34px;\n  line-height: 1.35;\n  color: var(--ink-2);\n  font-weight: 300;\n  letter-spacing: -0.01em;\n  max-width: 1200px;\n  text-wrap: pretty;\n}\n\n.accent { color: var(--accent); }\n\n/* ==========================================================\n   Panels / cards (no blur, just solid tint + hairline)\n   ========================================================== */\n.card {\n  background: var(--panel);\n  border: 1px solid var(--line);\n  border-radius: var(--radius-lg);\n  padding: 36px;\n  display: flex;\n  flex-direction: column;\n  gap: 20px;\n}\n.card-flush { padding: 0; overflow: hidden; }\n.card-tight { padding: 24px; gap: 14px; }\n\n.card h3 {\n  margin: 0;\n  font-size: 34px;\n  font-weight: 500;\n  letter-spacing: -0.01em;\n}\n\n.hline {\n  height: 1px;\n  background: var(--line);\n  width: 100%;\n}\n.vline {\n  width: 1px;\n  background: var(--line);\n  align-self: stretch;\n}\n\n/* chip / pill */\n.chip {\n  display: inline-flex;\n  align-items: center;\n  gap: 8px;\n  padding: 10px 16px;\n  border: 1px solid var(--line-2);\n  border-radius: 999px;\n  font-size: 15px;\n  font-weight: 500;\n  color: var(--ink-2);\n  background: transparent;\n}\n.chip .sw { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }\n\n/* number / stat */\n.stat {\n  display: flex;\n  flex-direction: column;\n  gap: 6px;\n}\n.stat .k { font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; }\n.stat .v { font-size: 64px; font-weight: 600; letter-spacing: -0.02em; }\n.stat .u { color: var(--ink-3); font-weight: 300; font-size: 28px; margin-left: 6px; }\n\n/* key : value rows */\n.kv {\n  display: grid;\n  grid-template-columns: auto 1fr;\n  gap: 10px 28px;\n  font-size: 20px;\n}\n.kv .k { color: var(--ink-3); font-weight: 400; }\n.kv .v { color: var(--ink); font-weight: 500; font-family: ui-monospace, \"SF Mono\", Menlo, monospace; }\n\n/* ==========================================================\n   Data table\n   ========================================================== */\n.tbl {\n  width: 100%;\n  border-collapse: collapse;\n  font-variant-numeric: tabular-nums;\n}\n.tbl th, .tbl td {\n  text-align: left;\n  padding: 16px 20px;\n  font-size: 20px;\n  border-bottom: 1px solid var(--line);\n}\n.tbl th {\n  font-weight: 500;\n  color: var(--ink-3);\n  font-size: 13px;\n  letter-spacing: 0.12em;\n  text-transform: uppercase;\n  border-bottom: 1px solid var(--line-2);\n}\n.tbl td { color: var(--ink); font-family: ui-monospace, \"SF Mono\", Menlo, monospace; font-weight: 400; }\n.tbl td:first-child { font-family: inherit; font-weight: 500; color: var(--ink); }\n.tbl tr.best td { background: rgba(124,194,142,0.05); }\n.tbl tr.worst td { background: rgba(224,108,91,0.05); }\n.tbl .flag { color: var(--bad); font-weight: 600; }\n.tbl .ok   { color: var(--good); font-weight: 600; }\n\n/* ==========================================================\n   Figure placeholder\n   ========================================================== */\n.figure {\n  background: var(--panel-2);\n  border: 1px solid var(--line);\n  border-radius: var(--radius);\n  overflow: hidden;\n  position: relative;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n}\n.figure img { display: block; width: 100%; height: 100%; object-fit: contain; }\n.ph {\n  color: var(--ink-3);\n  text-align: center;\n  padding: 24px;\n  display: flex;\n  flex-direction: column;\n  gap: 6px;\n  align-items: center;\n}\n.ph .ph-title { font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 500; }\n.ph .ph-sub { font-size: 12px; color: var(--ink-4); font-family: ui-monospace, \"SF Mono\", Menlo, monospace; }\n.ph .ph-frame {\n  width: 52px; height: 52px;\n  border: 1px solid var(--line-2);\n  border-radius: 8px;\n  margin-bottom: 6px;\n  display: flex; align-items: center; justify-content: center;\n}\n\n/* ==========================================================\n   Arrows, pipe diagram\n   ========================================================== */\n.pipe {\n  display: flex;\n  align-items: stretch;\n  gap: 14px;\n  flex-wrap: wrap;\n}\n.pipe .node {\n  flex: 1 1 0;\n  min-width: 180px;\n  padding: 24px 20px;\n  border: 1px solid var(--line);\n  border-radius: var(--radius);\n  background: var(--panel);\n  display: flex;\n  flex-direction: column;\n  gap: 8px;\n}\n.pipe .node .k { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; }\n.pipe .node .v { font-size: 22px; font-weight: 500; letter-spacing: -0.01em; }\n.pipe .node .s { font-size: 14px; color: var(--ink-3); font-family: ui-monospace, \"SF Mono\", Menlo, monospace; }\n.pipe .arr {\n  flex: 0 0 auto;\n  align-self: center;\n  color: var(--ink-4);\n  font-size: 18px;\n  font-weight: 400;\n}\n.pipe .node.hl { border-color: var(--accent-dim); }\n.pipe .node.hl .v { color: var(--accent); }\n\n/* ==========================================================\n   Utility\n   ========================================================== */\n.row { display: flex; }\n.col { display: flex; flex-direction: column; }\n.gap-xs { gap: 8px; }\n.gap-s  { gap: 16px; }\n.gap-m  { gap: 24px; }\n.gap-l  { gap: 40px; }\n.gap-xl { gap: 64px; }\n.flex-1 { flex: 1; min-height: 0; min-width: 0; }\n.center { align-items: center; justify-content: center; }\n.between { justify-content: space-between; }\n.wrap { flex-wrap: wrap; }\n\n.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }\n.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 24px; }\n.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }\n\n/* deck chrome overrides */\n:root { --deck-bg: #000; }\ndeck-stage { background: #000; }\n\n/* ==========================================================\n   Tweaks panel — compact, dark\n   ========================================================== */\n#tweaks-panel {\n  position: fixed;\n  right: 20px;\n  bottom: 20px;\n  width: 260px;\n  background: #0A0A0B;\n  border: 1px solid var(--line-2);\n  border-radius: 14px;\n  padding: 16px;\n  font-size: 12px;\n  color: var(--ink);\n  z-index: 1000;\n  display: none;\n  font-family: -apple-system, \"SF Pro Text\", BlinkMacSystemFont, sans-serif;\n}\n#tweaks-panel.visible { display: block; }\n#tweaks-panel h4 { margin: 0 0 14px; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; }\n#tweaks-panel .row { display: block; margin-bottom: 12px; }\n#tweaks-panel label { display: flex; justify-content: space-between; margin-bottom: 6px; color: var(--ink-2); }\n#tweaks-panel .val { color: var(--ink); font-family: ui-monospace, monospace; }\n#tweaks-panel input[type=\"range\"] { width: 100%; accent-color: var(--accent); }\n#tweaks-panel .seg { display: flex; gap: 3px; background: rgba(255,255,255,0.04); padding: 3px; border-radius: 8px; }\n#tweaks-panel .seg button { flex: 1; background: transparent; border: 0; color: var(--ink-2); padding: 6px 8px; font-size: 11px; border-radius: 6px; cursor: pointer; font-family: inherit; }\n#tweaks-panel .seg button.on { background: rgba(255,255,255,0.10); color: var(--ink); }\n\n/* ==========================================================\n   Print: each slide on its own page\n   ========================================================== */\n@media print {\n  html, body { background: #000 !important; }\n  .slide { page-break-after: always; }\n  #tweaks-panel { display: none !important; }\n}\n<\u002Fstyle>\n<style>/* ==========================================================\n   FX — signature motion, transitions, micro-interactions\n   Original system, not derivative of any shipped design language.\n   ========================================================== */\n\n/* ------- (A) slide enter/exit choreography ------- */\n/* each slide animates IN when .is-active, rises OUT when .was-active */\ndeck-stage ::slotted(section.slide) {\n  transition: opacity 360ms cubic-bezier(.22,.61,.36,1);\n}\n\n.slide .content > * {\n  opacity: 0;\n  transform: translateY(14px);\n  transition:\n    opacity 520ms cubic-bezier(.22,.61,.36,1),\n    transform 520ms cubic-bezier(.22,.61,.36,1);\n}\n.slide.is-active .content > * {\n  opacity: 1;\n  transform: translateY(0);\n}\n/* stagger: :nth-child delays */\n.slide.is-active .content > *:nth-child(1) { transition-delay: 60ms; }\n.slide.is-active .content > *:nth-child(2) { transition-delay: 140ms; }\n.slide.is-active .content > *:nth-child(3) { transition-delay: 220ms; }\n.slide.is-active .content > *:nth-child(4) { transition-delay: 300ms; }\n.slide.is-active .content > *:nth-child(5) { transition-delay: 380ms; }\n.slide.is-active .content > *:nth-child(6) { transition-delay: 460ms; }\n\n/* chrome top-bar slides down */\n.slide .chrome {\n  opacity: 0;\n  transform: translateY(-8px);\n  transition: opacity 300ms ease, transform 360ms cubic-bezier(.22,.61,.36,1);\n  transition-delay: 40ms;\n}\n.slide.is-active .chrome { opacity: 1; transform: translateY(0); }\n\n/* accent-dot pulse on the active slide's chrome */\n.slide.is-active .chrome .dot {\n  animation: dotPulse 2.6s ease-in-out infinite;\n}\n@keyframes dotPulse {\n  0%, 100% { box-shadow: 0 0 0 0 rgba(232,183,94,0.55); }\n  50%      { box-shadow: 0 0 0 6px rgba(232,183,94,0.00); }\n}\n\n/* hairlines draw on */\n.slide::after {\n  transform-origin: left center;\n  transform: scaleX(0);\n  transition: transform 800ms cubic-bezier(.22,.61,.36,1) 120ms;\n}\n.slide.is-active::after { transform: scaleX(1); }\n\n/* ------- (B) signature: scatter-converge point-cloud title ------- */\n.pc-title {\n  position: relative;\n  display: inline-block;\n  line-height: 0.92;\n  letter-spacing: -0.035em;\n}\n.pc-title .pc-letter {\n  display: inline-block;\n  position: relative;\n  white-space: pre;\n  opacity: 0;\n  transform: translate(var(--dx,0), var(--dy,0)) rotate(var(--dr,0deg));\n  transition:\n    opacity 680ms cubic-bezier(.22,.61,.36,1),\n    transform 780ms cubic-bezier(.22,.61,.36,1);\n  transition-delay: calc(var(--i,0) * 24ms + 100ms);\n}\n.slide.is-active .pc-title .pc-letter {\n  opacity: 1;\n  transform: translate(0,0) rotate(0deg);\n}\n\n/* residual dots that scatter behind the title on reveal */\n.pc-title .pc-dots {\n  position: absolute;\n  inset: -20px -40px;\n  pointer-events: none;\n}\n.pc-title .pc-dots span {\n  position: absolute;\n  width: 3px; height: 3px;\n  border-radius: 50%;\n  background: var(--accent);\n  opacity: 0;\n  transform: translate(var(--sx,0), var(--sy,0));\n  transition:\n    opacity 900ms cubic-bezier(.22,.61,.36,1),\n    transform 1200ms cubic-bezier(.22,.61,.36,1);\n}\n.slide.is-active .pc-title .pc-dots span {\n  opacity: 0.28;\n  transform: translate(0,0);\n  transition-delay: calc(var(--i,0) * 8ms + 400ms);\n}\n\n/* ------- (C) card \"materialise\" — hairline draws, fill follows ------- */\n.card, .pipe .node, .figure, .tbl {\n  position: relative;\n}\n.card::before, .pipe .node::before, .figure::before {\n  content: \"\";\n  position: absolute;\n  inset: -1px;\n  border: 1px solid var(--accent-dim);\n  border-radius: inherit;\n  opacity: 0;\n  clip-path: inset(0 100% 0 0);\n  transition: clip-path 700ms cubic-bezier(.22,.61,.36,1), opacity 400ms ease;\n  pointer-events: none;\n}\n.slide.is-active .card::before,\n.slide.is-active .pipe .node::before,\n.slide.is-active .figure::before {\n  clip-path: inset(0 0 0 0);\n  opacity: 0.0; /* trace draws through, leaves no permanent outline */\n  animation: traceFade 900ms cubic-bezier(.22,.61,.36,1) 200ms both;\n}\n@keyframes traceFade {\n  0%   { opacity: 0; clip-path: inset(0 100% 0 0); }\n  25%  { opacity: 0.85; }\n  60%  { opacity: 0.45; clip-path: inset(0 0 0 0); }\n  100% { opacity: 0;    clip-path: inset(0 0 0 0); }\n}\n\n/* ------- (D) kinetic counter — numbers rise into place ------- */\n.tick {\n  display: inline-block;\n  font-variant-numeric: tabular-nums;\n  font-feature-settings: \"tnum\";\n  transition: color 400ms ease;\n}\n.tick[data-counting] { color: var(--accent); }\n\n/* ------- (E) hover: ATE row residual vector ------- */\n.tbl tbody tr {\n  transition: background 220ms ease, box-shadow 220ms ease;\n  cursor: default;\n}\n.tbl tbody tr:hover {\n  background: rgba(255,255,255,0.03);\n}\n.tbl tbody tr:hover td:first-child {\n  box-shadow: inset 2px 0 0 var(--accent);\n}\n\n/* ------- (F) accent underline that sweeps under title on reveal ------- */\n.sweep-underline {\n  position: relative;\n  display: inline-block;\n}\n.sweep-underline::after {\n  content: \"\";\n  position: absolute;\n  left: 0; right: 0; bottom: -10px;\n  height: 2px;\n  background: var(--accent);\n  transform: scaleX(0);\n  transform-origin: left center;\n  transition: transform 900ms cubic-bezier(.22,.61,.36,1) 500ms;\n}\n.slide.is-active .sweep-underline::after { transform: scaleX(1); }\n\n/* ------- (G) pipe arrows animate stroke-dashoffset ------- */\n.pipe-svg path {\n  stroke-dasharray: 280;\n  stroke-dashoffset: 280;\n  transition: stroke-dashoffset 900ms cubic-bezier(.22,.61,.36,1) 300ms;\n}\n.slide.is-active .pipe-svg path { stroke-dashoffset: 0; }\n\n/* ------- (H) trajectory scrubber (bottom-left, interactive) ------- */\n#scrubber {\n  position: fixed;\n  left: 24px;\n  bottom: 24px;\n  width: 320px;\n  padding: 14px 16px;\n  background: rgba(10,10,11,0.88);\n  border: 1px solid rgba(255,255,255,0.12);\n  border-radius: 12px;\n  color: var(--ink);\n  font-family: ui-monospace, \"SF Mono\", Menlo, monospace;\n  font-size: 11px;\n  letter-spacing: 0.06em;\n  display: flex;\n  flex-direction: column;\n  gap: 8px;\n  z-index: 900;\n  opacity: 0;\n  transform: translateY(12px);\n  transition: opacity 300ms ease, transform 320ms cubic-bezier(.22,.61,.36,1);\n  pointer-events: none;\n  backdrop-filter: none;\n}\n#scrubber.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }\n#scrubber .head { display: flex; justify-content: space-between; color: rgba(245,245,247,0.48); text-transform: uppercase; letter-spacing: 0.14em; font-size: 10px; }\n#scrubber .accent-num { color: var(--accent); }\n#scrubber svg { display: block; width: 100%; height: 48px; cursor: crosshair; }\n#scrubber .path-bg { stroke: rgba(255,255,255,0.1); fill: none; stroke-width: 1.5; }\n#scrubber .path-trace { stroke: var(--accent); fill: none; stroke-width: 1.5; stroke-linecap: round; }\n#scrubber .tip { fill: var(--accent); }\n#scrubber .readout { display: flex; justify-content: space-between; color: rgba(245,245,247,0.72); }\n\n/* ------- (I) radial progress in top-right (slide index ring) ------- */\n#slide-ring {\n  position: fixed;\n  right: 24px;\n  top: 24px;\n  width: 48px; height: 48px;\n  z-index: 900;\n  opacity: 0;\n  transition: opacity 300ms ease;\n  pointer-events: none;\n}\n#slide-ring.visible { opacity: 1; }\n#slide-ring circle { fill: none; stroke-width: 2; }\n#slide-ring .bg { stroke: rgba(255,255,255,0.1); }\n#slide-ring .fg { stroke: var(--accent); transition: stroke-dashoffset 520ms cubic-bezier(.22,.61,.36,1); }\n#slide-ring text { fill: var(--ink); font-family: ui-monospace, \"SF Mono\", monospace; font-size: 12px; text-anchor: middle; dominant-baseline: central; }\n\n/* ------- (J) press K for keyboard shortcut overlay ------- */\n#k-overlay {\n  position: fixed;\n  inset: 0;\n  background: rgba(0,0,0,0.75);\n  display: none;\n  align-items: center;\n  justify-content: center;\n  z-index: 5000;\n  opacity: 0;\n  transition: opacity 240ms ease;\n}\n#k-overlay.visible { display: flex; opacity: 1; }\n#k-overlay .k-card {\n  background: #0A0A0B;\n  border: 1px solid rgba(255,255,255,0.14);\n  border-radius: 18px;\n  padding: 40px 48px;\n  min-width: 520px;\n  font-family: -apple-system, \"SF Pro Text\", sans-serif;\n}\n#k-overlay h3 { margin: 0 0 24px; font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(245,245,247,0.48); font-weight: 500; }\n#k-overlay .kr { display: grid; grid-template-columns: 120px 1fr; gap: 16px 24px; font-size: 15px; margin-bottom: 10px; align-items: center; }\n#k-overlay kbd {\n  display: inline-block;\n  padding: 4px 10px;\n  border: 1px solid rgba(255,255,255,0.18);\n  border-radius: 6px;\n  background: rgba(255,255,255,0.04);\n  font-family: ui-monospace, \"SF Mono\", monospace;\n  font-size: 12px;\n  color: #F5F5F7;\n}\n#k-overlay .kd { color: rgba(245,245,247,0.72); }\n\n/* ------- (K) focus-mode: click a card to isolate it (Q6 table / figures) ------- */\n.slide .zoomable { cursor: zoom-in; transition: transform 380ms cubic-bezier(.22,.61,.36,1), box-shadow 300ms ease; }\n.slide .zoomable.focused {\n  position: fixed;\n  inset: 6vh 6vw;\n  z-index: 2000;\n  cursor: zoom-out;\n  box-shadow: 0 40px 120px rgba(0,0,0,0.7), 0 0 0 1px rgba(232,183,94,0.35);\n  background: #0A0A0B;\n}\n.slide .zoomable.focused + .zoom-scrim {\n  position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1500; cursor: zoom-out;\n}\n\n/* reduced motion respect */\n@media (prefers-reduced-motion: reduce) {\n  .slide .content > *, .slide.is-active .content > *,\n  .pc-title .pc-letter, .slide.is-active .pc-title .pc-letter,\n  .pc-title .pc-dots span, .slide.is-active .pc-title .pc-dots span,\n  .card::before, .pipe .node::before, .figure::before,\n  .sweep-underline::after, .pipe-svg path, #scrubber, #slide-ring {\n    transition: none !important;\n    animation: none !important;\n  }\n  .slide .content > * { opacity: 1; transform: none; }\n  .pc-title .pc-letter { opacity: 1; transform: none; }\n}\n\n/* motion class toggle via Tweaks */\nbody.no-motion *, body.no-motion *::before, body.no-motion *::after {\n  transition-duration: 0ms !important;\n  animation: none !important;\n}\nbody.no-motion .pc-title .pc-letter { opacity: 1; transform: none; }\nbody.no-motion .slide .content > * { opacity: 1; transform: none; }\n<\u002Fstyle>\n\n\n\n<script type=\"application/json\" id=\"speaker-notes\">\n[\n\"Good afternoon. This is our coursework 02 defence for COMP0222. Over the next ten minutes we'll walk through the visual SLAM pipeline for Q2, and the 2D LiDAR SLAM pipeline for Q3, both on data we captured ourselves around campus. Q1 sat entirely in the report, so we'll focus the oral on Q2 and Q3, where the hardest decisions live.\",\n\"Here is the plan. Five minutes on Q2 — monocular ORB-SLAM2 on our RealSense D455 footage. Five minutes on Q3 — ICP odometry plus a GTSAM pose-graph back-end on our RPLidar A1 scans. Q1 results are cited in the report only. We collected everything ourselves on two sensors on a single rig: the D455 for colour video at 720p30, the RPLidar A1 for 360-degree planar scans.\",\n\"Q2. We captured nine sequences, indoor and outdoor, with the D455. Every sequence was pushed through COLMAP for an offline structure-from-motion reconstruction — that gives us the intrinsics K and a pseudo-ground-truth trajectory. Those intrinsics are then loaded into the ORB-SLAM2 YAML, and we run ORB-SLAM2 monocular online. The whole point of the COLMAP arm is that the vendor intrinsics were off by about twelve percent, so we had to recover K from the data.\",\n\"This is the full Q2 pipeline on a single slide. Video stream at thirty hertz feeds COLMAP sequential SfM, which gives us K, reference poses, and a dense point cloud as side outputs. K goes into ORB-SLAM2. ORB-SLAM2 emits a keyframe trajectory, which we hand to EVO with align and correct-scale for Sim-three alignment. EVO gives us APE, RPE, and the comparative plots.\",\n\"Same scene, reconstructed two different ways. On the left, COLMAP dense point cloud from the Floor 7 hallway — batch, triangulated from every thirtieth frame. On the right, ORB-SLAM2's online keyframe trajectory and sparse map on the same sequence. Same intrinsics, same input video. Different front-ends, same geometry — that's the sanity check we needed before trusting either one.\",\n\"This is the money slide for Q2. EVO absolute trajectory error against our COLMAP baseline, with Sim-three alignment applied. Indoor hallways come in around one percent drift — state-of-the-art parity for monocular. Outdoor degrades to about one-point-three times worse. And one row jumps out: OnePoolStreet1 with one-seventy-five degrees of rotational ATE. That's not a heading failure; that is a scale collapse masquerading as a flip, and the next slide explains why.\",\n\"Three ways monocular ORB-SLAM2 breaks. Pure rotation kills triangulation — no parallax, no new map points. Texture-poor walls starve the matcher — fewer than fifty inliers and tracking drops to a motion-model prior. And Sim-three scale ambiguity: when Umeyama alignment fits a near-zero scale factor, the rotation component absorbs it as a one-eighty flip. That's what the OnePoolStreet1 row is — a scale collapse artefact, not a real heading error.\",\n\"Three takeaways from Q2, then we hand off to Q3. One — you cannot skip COLMAP intrinsic recovery; vendor specs were twelve percent off and that propagates into drift. Two — monocular ORB-SLAM2 gives us roughly one percent drift indoors, about two-and-a-half times worse outdoors. Three — rotation ATE is a diagnostic, not a failure mode; it's how we spotted scale collapse.\",\n\"Q3. We switched to the RPLidar A1 and collected three representative sequences — a small indoor washroom, a larger indoor hallway on Floor 7, and an outdoor loop. Every trajectory is two closed loops returning to a floor marker. That return is deliberate: without ground truth, the start-to-end Euclidean error is our drift metric. We call it closure error. It's what everything on the next few slides minimises.\",\n\"Q3 pipeline. Front-end is point-to-plane ICP against the previous scan, running in scikit-learn nearest-neighbour search, fifty iterations, five-centimetre voxel downsample. That yields local odometry. A loop-closure detector runs in parallel and fires whenever we come near a past pose. Back-end is GTSAM with Pose-two factors, optimised by Levenberg-Marquardt, with a scipy SLSQP fallback if GTSAM fails to converge. Output: optimised trajectory plus a log-odds occupancy grid.\",\n\"Q3b — parameter sensitivity. We swept four knobs. Maximum range: six metres hurts closure error; twelve metres is our chosen value. Angular resolution: the full scan wins; subsampling every second or third ray degrades monotonically. Voxel size: five centimetres is the sweet spot — ten and twenty centimetres blur real features. Scan rate: full rate is best, but half rate survives. The headline: geometry-limited beats data-limited — voxel size matters more than scan rate.\",\n\"Q3c — the loop-closure detector. Three gates, all of which must pass. Spatial: the candidate must be within two metres of a past pose. Temporal: at least fifty scans apart, so we don't match a scan to itself. Geometric: ICP fitness above zero-point-seven. After that, we add a Pose-two between-factor with ten-centimetre translation sigma and two-degree rotation sigma, and re-optimise. Hysteresis of two hundred scans between accepted closures. In thirty candidates across all sequences — zero false positives.\",\n\"Q3d — before and after pose-graph optimisation. Left card is odometry-only, one-point-eight-four metres of closure error on Floor 7. Right card is after GTSAM Pose-two Levenberg-Marquardt with our loop-closure factors: seven centimetres. That is a ninety-six percent reduction. Basement_1 and Outdoor_1 both show ninety-plus percent reductions. The factor graph is doing almost all the accuracy work; ICP just has to be good enough to get us close.\",\n\"Final Q3 occupancy maps. Floor 7 hallway — seven centimetres closure, two-point-one pixel standard deviation along the walls. Basement, twelve centimetres. Outdoor, thirty-four centimetres — the worst, as expected, because the outdoor sequence has the longest path and the least structural constraint.\",\n\"That concludes our defence of the pipeline decisions, the failure analyses, and the numbers. We're happy to go deeper on any of it — intrinsic recovery from COLMAP, the Sim-three alignment maths, the ICP convergence basin, how we picked the GTSAM noise model, the loop-closure false-positive analysis, or the log-odds tuning for the occupancy grid. Thank you.\"\n]\n<\u002Fscript>\n<\u002Fhead>\n<body>\n\n<deck-stage width=\"1920\" height=\"1080\">\n\n<!-- ==================== 01 · TITLE ==================== -->\n<section class=\"slide\" data-screen-label=\"01 Title\">\n  <div class=\"chrome\">\n    <div><span class=\"dot\"><\u002Fspan>COMP0222 · COURSEWORK 02<\u002Fdiv>\n    <div class=\"num mono\">01 / 15<\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"content center\" style=\"justify-content:center; gap:48px;\">\n    <div class=\"eyebrow\">Visual &amp; LiDAR SLAM — Oral Defence<\u002Fdiv>\n    <h1 class=\"display w-700 pc-title\" style=\"margin:0; text-align:center; max-width:1500px;\">Visual &amp; LiDAR SLAM<\u002Fh1>\n    <div class=\"subtitle\" style=\"text-align:center; max-width:1200px;\">Own data. Own pipeline. Own <span class=\"accent\">failure modes<\u002Fspan>.<\u002Fdiv>\n    <div class=\"row gap-m\" style=\"margin-top:12px;\">\n      <span class=\"chip\"><span class=\"sw\"><\u002Fspan>Group 7<\u002Fspan>\n      <span class=\"chip mono\">RealSense D455<\u002Fspan>\n      <span class=\"chip mono\">RPLidar A1<\u002Fspan>\n      <span class=\"chip mono\">ORB-SLAM2<\u002Fspan>\n      <span class=\"chip mono\">COLMAP<\u002Fspan>\n      <span class=\"chip mono\">GTSAM<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ==================== 02 · OUTLINE ==================== -->\n<section class=\"slide\" data-screen-label=\"02 Outline\">\n  <div class=\"chrome\"><div><span class=\"dot\"><\u002Fspan>Outline · Sensors<\u002Fdiv><div class=\"num mono\">02 / 15<\u002Fdiv><\u002Fdiv>\n  <div class=\"content\" style=\"padding-top:60px; gap:40px;\">\n    <div class=\"col gap-xs\">\n      <div class=\"eyebrow\">Ten minutes · three parts<\u002Fdiv>\n      <h2 class=\"title w-500 sweep-underline\" style=\"margin:0;\">Q2 and Q3 defended live. Q1 in the report.<\u002Fh2>\n    <\u002Fdiv>\n    <div class=\"grid-3 flex-1\" style=\"gap:28px;\">\n      <div class=\"card\">\n        <div class=\"row between center\"><div class=\"eyebrow\">Q2 · Visual SLAM<\u002Fdiv><div class=\"mono caption\">33 marks<\u002Fdiv><\u002Fdiv>\n        <div class=\"title w-300\" style=\"font-size:48px;\">Monocular<br>ORB-SLAM2<\u002Fdiv>\n        <div class=\"caption\">COLMAP intrinsics recovery · EVO Sim(3) alignment · 9 sequences, indoor + outdoor.<\u002Fdiv>\n        <div class=\"mono caption accent\" style=\"margin-top:auto;\">5 min<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"card\">\n        <div class=\"row between center\"><div class=\"eyebrow\">Q3 · LiDAR SLAM<\u002Fdiv><div class=\"mono caption\">37 marks<\u002Fdiv><\u002Fdiv>\n        <div class=\"title w-300\" style=\"font-size:48px;\">ICP +<br>GTSAM pose-graph<\u002Fdiv>\n        <div class=\"caption\">Point-to-plane ICP · loop-closure factor graph · 3 sequences with return-to-origin ground truth.<\u002Fdiv>\n        <div class=\"mono caption accent\" style=\"margin-top:auto;\">5 min<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"card\" style=\"opacity:0.65;\">\n        <div class=\"row between center\"><div class=\"eyebrow\">Q1 · Report only<\u002Fdiv><div class=\"mono caption\">—<\u002Fdiv><\u002Fdiv>\n        <div class=\"title w-300\" style=\"font-size:48px;\">Theory<br>&amp; derivations<\u002Fdiv>\n        <div class=\"caption\">Sim(3) closed form, ICP Jacobian, GTSAM noise model selection — cited in report sections 2–4.<\u002Fdiv>\n        <div class=\"mono caption\" style=\"margin-top:auto; color:var(--ink-4);\">not defended<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"hline\"><\u002Fdiv>\n    <div class=\"grid-2\">\n      <div class=\"row gap-m center\">\n        <svg width=\"56\" height=\"40\" viewBox=\"0 0 56 40\" fill=\"none\"><rect x=\"3\" y=\"8\" width=\"50\" height=\"26\" rx=\"4\" stroke=\"#E8B75E\" stroke-width=\"1.5\"><\u002Frect><circle cx=\"18\" cy=\"21\" r=\"7\" stroke=\"#E8B75E\" stroke-width=\"1.5\"><\u002Fcircle><circle cx=\"18\" cy=\"21\" r=\"3\" fill=\"#E8B75E\"><\u002Fcircle><circle cx=\"36\" cy=\"21\" r=\"4\" stroke=\"#E8B75E\" stroke-width=\"1.5\"><\u002Fcircle><circle cx=\"46\" cy=\"21\" r=\"4\" stroke=\"#E8B75E\" stroke-width=\"1.5\"><\u002Fcircle><rect x=\"10\" y=\"4\" width=\"10\" height=\"4\" rx=\"1\" stroke=\"#E8B75E\" stroke-width=\"1.5\"><\u002Frect><\u002Fsvg>\n        <div class=\"col\"><div class=\"eyebrow\">RGB-D sensor<\u002Fdiv><div class=\"w-500\" style=\"font-size:26px;\">RealSense D455<\u002Fdiv><div class=\"caption mono\">RGB · 1280 × 720 · 30 Hz<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"row gap-m center\">\n        <svg width=\"56\" height=\"40\" viewBox=\"0 0 56 40\" fill=\"none\"><circle cx=\"28\" cy=\"20\" r=\"14\" stroke=\"#E8B75E\" stroke-width=\"1.5\"><\u002Fcircle><circle cx=\"28\" cy=\"20\" r=\"6\" stroke=\"#E8B75E\" stroke-width=\"1.5\"><\u002Fcircle><line x1=\"28\" y1=\"2\" x2=\"28\" y2=\"6\" stroke=\"#E8B75E\" stroke-width=\"1.5\"><\u002Fline><line x1=\"28\" y1=\"34\" x2=\"28\" y2=\"38\" stroke=\"#E8B75E\" stroke-width=\"1.5\"><\u002Fline><line x1=\"10\" y1=\"20\" x2=\"6\" y2=\"20\" stroke=\"#E8B75E\" stroke-width=\"1.5\"><\u002Fline><line x1=\"46\" y1=\"20\" x2=\"50\" y2=\"20\" stroke=\"#E8B75E\" stroke-width=\"1.5\"><\u002Fline><\u002Fsvg>\n        <div class=\"col\"><div class=\"eyebrow\">2D LiDAR<\u002Fdiv><div class=\"w-500\" style=\"font-size:26px;\">RPLidar A1<\u002Fdiv><div class=\"caption mono\">360° · 12 m range · 5.5 Hz<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- Slides 03–15 appended by slides.js -->\n<\u002Fdeck-stage>\n\n<!-- Tweaks panel -->\n<div id=\"tweaks-panel\">\n  <h4>Tweaks<\u002Fh4>\n  <div class=\"row\">\n    <label>Accent tone <span class=\"val\" data-val=\"accent\">amber<\u002Fspan><\u002Fla
